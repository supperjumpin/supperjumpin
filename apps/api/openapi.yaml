openapi: 3.1.0
info:
  title: Supperjumpin API
  version: 0.1.0
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Fetch the signed-in Account and Player identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The internal Account and Player attached to the external auth identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token.
  /v1/groups:
    get:
      operationId: listGroups
      summary: List the signed-in Player's Group Memberships
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Group Memberships for the signed-in Player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupsResponse"
        "401":
          description: Missing or invalid bearer token.
    post:
      operationId: createGroup
      summary: Create a Group and make the creator a Group Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: The created Group home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupHomeResponse"
        "400":
          description: Invalid Group creation request.
        "401":
          description: Missing or invalid bearer token.
  /v1/groups/{groupId}/home:
    get:
      operationId: getGroupHome
      summary: Fetch backend Group home data for a Group member
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group identity, the Player's Group Membership, current Season state, recent Stunts, and Standings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupHomeResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player does not have a Group Membership for this Group.
  /v1/groups/{groupId}/invites:
    post:
      operationId: createInvite
      summary: Create an Invite for a Group
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Invite that another signed-in Account can accept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player does not have a Group Membership for this Group.
  /v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Accept an Invite and join its Group
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invited Group home after the signed-in Player joins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupHomeResponse"
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Invite is invalid.
        "409":
          description: Invite was already used, or the signed-in Player already has a Group Membership.
        "410":
          description: Invite expired.
  /v1/groups/{groupId}/seasons:
    post:
      operationId: startSeason
      summary: Start a Season for a Group with no active or closing Season
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The Group home after starting the Active Season.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupHomeResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player does not have a Group Membership for this Group.
        "409":
          description: The Group already has an active or closing Season.
  /v1/groups/{groupId}/ideas:
    post:
      operationId: createIdea
      summary: Create an Idea in exactly one Group
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, destination, food]
              properties:
                source:
                  type: string
                destination:
                  type: string
                food:
                  type: string
      responses:
        "201":
          description: The created Group-scoped Idea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stunt"
        "400":
          description: Invalid Idea creation request.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player does not have a Group Membership for this Group.
  /v1/ideas/{ideaId}/planned-stunt:
    post:
      operationId: createPlannedStunt
      summary: Create a Planned Stunt from an Idea
      security:
        - bearerAuth: []
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                offSeason:
                  type: boolean
                  description: When true, the Planned Stunt is explicitly Off-Season even during an Active Season.
      responses:
        "201":
          description: The Planned Stunt, Season-linked by default during an Active Season.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stunt"
        "400":
          description: Invalid Planned Stunt request.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player is not allowed to plan this Idea.
        "404":
          description: Idea not found.
  /v1/stunts/{stuntId}/evidence-upload-authorizations:
    post:
      operationId: authorizeEvidenceUpload
      summary: Authorize direct Evidence upload for a performer's Planned Stunt
      security:
        - bearerAuth: []
      parameters:
        - name: stuntId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
      responses:
        "201":
          description: Direct upload target and authorization metadata for the Evidence media.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadAuthorization"
        "400":
          description: Invalid Evidence upload authorization request.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player is not the performer of this Planned Stunt.
        "404":
          description: Planned Stunt not found.
  /v1/stunts/{stuntId}/evidence:
    post:
      operationId: submitEvidence
      summary: Finalize an Evidence record and transition a Planned Stunt into a Performed Stunt
      security:
        - bearerAuth: []
      parameters:
        - name: stuntId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadAuthorizationId, caption]
              properties:
                uploadAuthorizationId:
                  type: string
                caption:
                  type: string
      responses:
        "201":
          description: Backend-owned Evidence record and the updated Performed Stunt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmission"
        "400":
          description: Invalid Evidence submission request.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player is not the performer of this Planned Stunt.
        "404":
          description: Planned Stunt or upload authorization not found.
  /v1/stunts/{stuntId}/judgment:
    post:
      operationId: submitJudgment
      summary: Submit or edit the signed-in Judge's Judgment for a Performed Stunt
      security:
        - bearerAuth: []
      parameters:
        - name: stuntId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty, transgression, creativity, documentation]
              properties:
                difficulty:
                  type: integer
                  minimum: 0
                  maximum: 10
                transgression:
                  type: integer
                  minimum: 0
                  maximum: 10
                creativity:
                  type: integer
                  minimum: 0
                  maximum: 10
                documentation:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        "200":
          description: The edited Judgment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Judgment"
        "201":
          description: The created Judgment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Judgment"
        "400":
          description: Invalid Judgment request.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The signed-in Player is not an eligible Judge for this Performed Stunt.
        "404":
          description: Performed Stunt not found.
        "409":
          description: The Judging Window is closed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeResponse:
      type: object
      required: [account, player]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        player:
          $ref: "#/components/schemas/Player"
    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Internal Account identifier, distinct from Supabase subject.
        email:
          type: string
          format: email
    Player:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Internal in-game Player identifier.
        displayName:
          type: string
    Group:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    GroupMembership:
      type: object
      required: [groupId, playerId, role]
      properties:
        groupId:
          type: string
        playerId:
          type: string
        role:
          type: string
          enum: [Group Admin, Player]
    Invite:
      type: object
      required: [id, groupId, token, createdBy, expiresAt]
      properties:
        id:
          type: string
        groupId:
          type: string
        token:
          type: string
        createdBy:
          type: string
        expiresAt:
          type: string
          format: date-time
    Season:
      type: object
      required: [id, groupId, commissionerPlayerId, status]
      properties:
        id:
          type: string
        groupId:
          type: string
        commissionerPlayerId:
          type: string
        status:
          type: string
          enum: [Active, Judging Grace Period, Finalized]
    Stunt:
      type: object
      required: [id, groupId, playerId, seasonId, status, source, destination, food, offSeason]
      properties:
        id:
          type: string
        groupId:
          type: string
          description: The exactly one Group this Stunt belongs to.
        playerId:
          type: string
        seasonId:
          anyOf:
            - type: string
            - type: "null"
          description: Present only for Season-linked Planned Stunts.
        status:
          type: string
          enum: [Idea, Planned Stunt, Performed Stunt]
        source:
          type: string
        destination:
          type: string
        food:
          type: string
        offSeason:
          type: boolean
    EvidenceUploadAuthorization:
      type: object
      required: [id, stuntId, uploadUrl, uploadMethod, uploadHeaders, mediaObjectKey, expiresAt]
      properties:
        id:
          type: string
        stuntId:
          type: string
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          enum: [PUT]
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
        mediaObjectKey:
          type: string
        expiresAt:
          type: string
          format: date-time
    Evidence:
      type: object
      required: [id, stuntId, caption, mediaObjectKey, createdAt]
      properties:
        id:
          type: string
        stuntId:
          type: string
        caption:
          type: string
        mediaObjectKey:
          type: string
        createdAt:
          type: string
          format: date-time
    EvidenceSubmission:
      type: object
      required: [stunt, evidence]
      properties:
        stunt:
          $ref: "#/components/schemas/Stunt"
        evidence:
          $ref: "#/components/schemas/Evidence"
    Judgment:
      type: object
      required: [id, stuntId, playerId, difficulty, transgression, creativity, documentation]
      properties:
        id:
          type: string
        stuntId:
          type: string
        playerId:
          type: string
        difficulty:
          type: integer
          minimum: 0
          maximum: 10
        transgression:
          type: integer
          minimum: 0
          maximum: 10
        creativity:
          type: integer
          minimum: 0
          maximum: 10
        documentation:
          type: integer
          minimum: 0
          maximum: 10
    PerformedStuntView:
      type: object
      required: [stunt, performer, evidence]
      properties:
        stunt:
          $ref: "#/components/schemas/Stunt"
        performer:
          $ref: "#/components/schemas/Player"
        evidence:
          $ref: "#/components/schemas/Evidence"
    GroupHomeResponse:
      type: object
      required: [group, membership, activeSeason, recentStunts, standings]
      properties:
        group:
          $ref: "#/components/schemas/Group"
        membership:
          $ref: "#/components/schemas/GroupMembership"
        activeSeason:
          anyOf:
            - $ref: "#/components/schemas/Season"
            - type: "null"
          description: The Group's Active Season, or null when none exists.
        recentStunts:
          type: array
          items:
            $ref: "#/components/schemas/PerformedStuntView"
        standings:
          type: array
          items: {}
    GroupMembershipSummary:
      type: object
      required: [group, membership]
      properties:
        group:
          $ref: "#/components/schemas/Group"
        membership:
          $ref: "#/components/schemas/GroupMembership"
    ListGroupsResponse:
      type: object
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/GroupMembershipSummary"
