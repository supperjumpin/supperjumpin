openapi: 3.1.0
info:
  title: Supperjumpin API
  version: 0.1.0
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Fetch the signed-in Account and Player identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The internal Account and Player attached to the external auth identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token.
  /v1/me/display-name:
    patch:
      operationId: updateDisplayName
      summary: Update the signed-in Player's display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        "200":
          description: The updated Player profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDisplayNameResponse"
        "400":
          description: Invalid or missing display name.
        "401":
          description: Missing or invalid bearer token.
  /v1/jumps:
    post:
      operationId: createJump
      summary: Create a Performed Jump with Evidence metadata
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, destination, food, caption, mediaObjectKey]
              properties:
                source:
                  type: string
                destination:
                  type: string
                food:
                  type: string
                caption:
                  type: string
                mediaObjectKey:
                  type: string
      responses:
        "201":
          description: The created Performed Jump.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jump"
        "400":
          description: Invalid or missing Jump fields.
        "401":
          description: Missing or invalid bearer token.
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      summary: Create a Guest Judge session for unauthenticated Judgments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: The created Guest Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
  /v1/jumps/{jumpId}/judgment:
    post:
      operationId: submitJudgment
      summary: Submit an immutable first-time Judgment for a Performed Jump (authenticated or Guest)
      security:
        - bearerAuth: []
      parameters:
        - name: jumpId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitment, transgression, creativity, presentation]
              properties:
                guestSessionId:
                  type: string
                  description: Required for Guest Judges. Must not be provided when authenticated.
                commitment:
                  type: integer
                  minimum: 1
                  maximum: 4
                transgression:
                  type: integer
                  minimum: 1
                  maximum: 4
                creativity:
                  type: integer
                  minimum: 1
                  maximum: 4
                presentation:
                  type: integer
                  minimum: 1
                  maximum: 4
      responses:
        "201":
          description: The created Judgment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Judgment"
        "400":
          description: Invalid Judgment request (malformed identity or out-of-range scores).
        "401":
          description: Authentication or guestSessionId required.
        "403":
          description: The Judge is not eligible (self-judge, guest cap reached, or grace period active).
        "404":
          description: Performed Jump not found.
        "409":
          description: The Judgment is immutable and already exists, or the Judging Window is closed.
  /v1/jumps/{jumpId}/retract:
    post:
      operationId: retractJump
      summary: Retract the authenticated Player's Performed Jump during its Author Grace Period
      security:
        - bearerAuth: []
      parameters:
        - name: jumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Jump retracted successfully. Feed excludes it; detail returns tombstone.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Retraction not allowed — Author Grace Period expired or requesting Player is not the performer.
        "404":
          description: Jump not found.
        "500":
          description: The retraction could not be applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/opens/{year}/{month}/compute:
    post:
      operationId: computeOpenScores
      summary: Compute Open Final Scores for a completed calendar month
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Open scores computed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "400":
          description: Invalid year or month.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Compute Open scores not allowed.
        "409":
          description: Open month has not soft-closed yet.
  /v1/feed:
    get:
      operationId: getPublicFeed
      summary: Public Feed of recent Jumps (reverse chronological, cursor paginated)
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Paginated Jump cards for the public Feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeedResponse"
        "500":
          description: The feed could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid cursor or limit parameter.
  /v1/jumps/{jumpId}:
    patch:
      operationId: editJumpCaption
      summary: Edit a Performed Jump's Caption during the Author Grace Period
      security:
        - bearerAuth: []
      parameters:
        - name: jumpId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caption]
              properties:
                caption:
                  type: string
      responses:
        "200":
          description: Caption updated successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "400":
          description: Invalid or missing caption.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Edit not allowed — Author Grace Period expired or requesting Player is not the performer.
        "404":
          description: Jump not found.
    get:
      operationId: getJumpDetail
      summary: Public Jump Detail — full read view or tombstone
      security: []
      parameters:
        - name: jumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Full Jump detail or tombstone response. Live Jumps (Performed, Judged, etc.)
            return JumpDetail. Removed Jumps return JumpTombstone with no content.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JumpDetail"
                  - $ref: "#/components/schemas/JumpTombstone"
        "404":
          description: Jump not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeResponse:
      type: object
      required: [account, player]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        player:
          $ref: "#/components/schemas/Player"
    UpdateDisplayNameResponse:
      type: object
      required: [player]
      properties:
        player:
          $ref: "#/components/schemas/Player"
    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Internal Account identifier, distinct from external auth provider subject.
        email:
          type: string
          format: email
    Player:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Internal in-game Player identifier.
        displayName:
          type: string
    Jump:
      type: object
      required: [id, playerId, status, source, destination, food, finalScore, openFinalScore, gracePeriodExpiresAt, createdAt]
      properties:
        id:
          type: string
        playerId:
          type: string
        status:
          type: string
          enum: [Performed Jump, Judged Jump, Unjudged Jump, Disqualified Jump, Removed Jump]
        source:
          type: string
        destination:
          type: string
        food:
          type: string
        finalScore:
          anyOf:
            - type: integer
            - type: "null"
        openFinalScore:
          anyOf:
            - type: integer
            - type: "null"
        gracePeriodExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Judgment:
      type: object
      required: [id, jumpId, commitment, transgression, creativity, presentation]
      properties:
        id:
          type: string
        jumpId:
          type: string
        playerId:
          type: string
          description: Present for authenticated Player judgments. Empty for Guest judgments.
        guestSessionId:
          type: string
          description: Present for Guest judgments. Empty for authenticated Player judgments.
        provenance:
          type: string
          enum: [public, open, season]
          description: Tracks the context in which the Judgment was submitted.
        commitment:
          type: integer
          minimum: 1
          maximum: 4
        transgression:
          type: integer
          minimum: 1
          maximum: 4
        creativity:
          type: integer
          minimum: 1
          maximum: 4
        presentation:
          type: integer
          minimum: 1
          maximum: 4
    GuestSession:
      type: object
      required: [id]
      properties:
        id:
          type: string
    PublicFeedResponse:
      type: object
      required: [jumps, nextCursor]
      properties:
        jumps:
          type: array
          items:
            $ref: "#/components/schemas/JumpCard"
        nextCursor:
          type: string
          nullable: true
    JumpCard:
      type: object
      required: [id, performerName, performerId, source, destination, food, caption, mediaObjectKey, status, gracePeriodExpiresAt, runningAverage, judgmentCount, createdAt]
      properties:
        id:
          type: string
        performerName:
          type: string
        performerId:
          type: string
        source:
          type: string
        destination:
          type: string
        food:
          type: string
        caption:
          type: string
        mediaObjectKey:
          type: string
        status:
          type: string
          enum: [Performed Jump, Judged Jump, Unjudged Jump, Disqualified Jump]
        gracePeriodExpiresAt:
          type: string
          format: date-time
        runningAverage:
          type: number
          format: float
        judgmentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    JumpDetail:
      type: object
      required: [id, performerName, performerId, source, destination, food, caption, mediaObjectKey, status, gracePeriodExpiresAt, runningAverage, judgmentCount, createdAt]
      properties:
        id:
          type: string
        performerName:
          type: string
        performerId:
          type: string
        source:
          type: string
        destination:
          type: string
        food:
          type: string
        caption:
          type: string
        mediaObjectKey:
          type: string
        status:
          type: string
          enum: [Performed Jump, Judged Jump, Unjudged Jump, Disqualified Jump]
        gracePeriodExpiresAt:
          type: string
          format: date-time
        runningAverage:
          type: number
          format: float
        judgmentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        finalScore:
          type: integer
          nullable: true
        viewerContext:
          $ref: "#/components/schemas/ViewerContext"
    JumpTombstone:
      type: object
      required: [id, status, message, removedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [Removed Jump]
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        removedAt:
          type: string
          format: date-time
    ViewerContext:
      type: object
      required: [canJudge, hasJudged]
      properties:
        canJudge:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [self-judging, grace-period, already-judged]
        gracePeriodEndsAt:
          type: string
          format: date-time
          nullable: true
        hasJudged:
          type: boolean
