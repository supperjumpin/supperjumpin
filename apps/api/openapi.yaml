openapi: 3.1.0
info:
  title: Supperjumpin API
  version: 0.1.0
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Fetch the signed-in Account and Player identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The internal Account and Player attached to the external auth identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token.
  /v1/me/display-name:
    patch:
      operationId: updateDisplayName
      summary: Update the signed-in Player's display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        "200":
          description: The updated Player profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDisplayNameResponse"
        "400":
          description: Invalid or missing display name.
        "401":
          description: Missing or invalid bearer token.
  /v1/prompt-catalog:
    get:
      operationId: listPromptCatalog
      summary: Fetch the platform-authored prompt catalog (packs and their prompts)
      responses:
        "200":
          description: The full prompt catalog, organized by pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCatalogResponse"
        "500":
          description: Internal server error.
  /v1/reveal-timeframes:
    get:
      operationId: listRevealTimeframes
      summary: Fetch the available reveal timeframe menu items
      responses:
        "200":
          description: The available reveal timeframes, ordered by sort_order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealTimeframesResponse"
        "500":
          description: Internal server error.
  /v1/rounds:
    post:
      operationId: startRound
      summary: Start a new Round for a Community
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRoundRequest"
      responses:
        "201":
          description: The newly created Round.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartRoundResponse"
        "400":
          description: Invalid or missing request body.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Forbidden — e.g. active Round already exists for this Community.
  /v1/rounds/{roundId}/commits:
    post:
      operationId: commitToRound
      summary: Commit to an active Round — Player becomes a Jumper
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Commit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Forbidden — round not found or already committed.
  /v1/rounds/{roundId}/jumps:
    post:
      operationId: submitJump
      summary: Submit a sealed Jump for an active Round
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJumpRequest"
      responses:
        "201":
          description: Jump submitted (sealed until reveal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitJumpResponse"
        "400":
          description: Invalid request body.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Forbidden — round not found, not committed, or already submitted.
    get:
      operationId: listRoundJumps
      summary: List Jumps for a Round (sealed pre-reveal), with commit/submission counts
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of Jumps with commit and submission counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJumpsResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Forbidden — round not found.
  /v1/rounds/{roundId}/jumps/{jumpId}:
    get:
      operationId: getJump
      summary: Get a single Jump (sealed pre-reveal for non-author)
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
        - name: jumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Jump (sealed if viewer is not the author and round not revealed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetJumpResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Forbidden — jump not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeResponse:
      type: object
      required: [account, player]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        player:
          $ref: "#/components/schemas/Player"
    UpdateDisplayNameResponse:
      type: object
      required: [player]
      properties:
        player:
          $ref: "#/components/schemas/Player"
    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Internal Account identifier, distinct from external auth provider subject.
        email:
          type: string
          format: email
    Player:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Internal in-game Player identifier.
        displayName:
          type: string
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    PromptCatalogResponse:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: "#/components/schemas/PromptPack"
    PromptPack:
      type: object
      required: [id, displayName, description, prompts]
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: string
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
    Prompt:
      type: object
      required: [id, copy, theme, costTier]
      properties:
        id:
          type: string
        copy:
          type: string
        theme:
          type: string
        costTier:
          type: string
    RevealTimeframe:
      type: object
      required: [id, label, durationHours]
      properties:
        id:
          type: string
        label:
          type: string
        durationHours:
          type: integer
    RevealTimeframesResponse:
      type: object
      required: [timeframes]
      properties:
        timeframes:
          type: array
          items:
            $ref: "#/components/schemas/RevealTimeframe"
    StartRoundRequest:
      type: object
      required: [communityId, revealTimeframeId]
      properties:
        communityId:
          type: string
        promptId:
          type: string
          description: If omitted, a random prompt is selected from the catalog.
        revealTimeframeId:
          type: string
    Round:
      type: object
      required: [id, communityId, promptId, status, revealBy, createdBy, createdAt]
      properties:
        id:
          type: string
        communityId:
          type: string
        promptId:
          type: string
        status:
          type: string
        revealBy:
          type: string
          format: date-time
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        prompt:
          $ref: "#/components/schemas/Prompt"
    StartRoundResponse:
      type: object
      required: [round]
      properties:
        round:
          $ref: "#/components/schemas/Round"
    CommitResponse:
      type: object
      required: [commitId]
      properties:
        commitId:
          type: string
    SubmitJumpRequest:
      type: object
      required: [caption]
      properties:
        caption:
          type: string
        evidenceUrls:
          type: array
          items:
            type: string
    SubmitJumpResponse:
      type: object
      required: [jump]
      properties:
        jump:
          $ref: "#/components/schemas/Jump"
    Jump:
      type: object
      required: [id, roundId, playerId, submittedAt, sealedViewer, playerHasCommitted, playerHasSubmitted]
      properties:
        id:
          type: string
        roundId:
          type: string
        playerId:
          type: string
        caption:
          type: string
        evidenceUrls:
          type: array
          items:
            type: string
        submittedAt:
          type: string
          format: date-time
        sealedViewer:
          type: boolean
        playerHasCommitted:
          type: boolean
        playerHasSubmitted:
          type: boolean
    ListJumpsResponse:
      type: object
      required: [jumps, commitCount, submissionCount]
      properties:
        jumps:
          type: array
          items:
            $ref: "#/components/schemas/Jump"
        commitCount:
          type: integer
        submissionCount:
          type: integer
    GetJumpResponse:
      type: object
      required: [jump]
      properties:
        jump:
          $ref: "#/components/schemas/Jump"
