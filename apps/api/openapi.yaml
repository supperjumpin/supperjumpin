openapi: 3.1.0
info:
  title: Supperjumpin API
  version: 0.1.0
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Fetch the signed-in Account and Player identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The internal Account and Player attached to the external auth identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token.
  /v1/me/display-name:
    patch:
      operationId: updateDisplayName
      summary: Update the signed-in Player's display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        "200":
          description: The updated Player profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDisplayNameResponse"
        "400":
          description: Invalid or missing display name.
        "401":
          description: Missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeResponse:
      type: object
      required: [account, player]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        player:
          $ref: "#/components/schemas/Player"
    UpdateDisplayNameResponse:
      type: object
      required: [player]
      properties:
        player:
          $ref: "#/components/schemas/Player"
    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Internal Account identifier, distinct from external auth provider subject.
        email:
          type: string
          format: email
    Player:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Internal in-game Player identifier.
        displayName:
          type: string
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
