            Jump Detail + Make the Call — best resolves the food-as-hero ↔
            readability tension, and does the Make the Call move feel immaculate?

  Three variants vary on ONE axis: how the hero food photo and the readable

   • body + CTA text meets WCAG AA (pairings verified)

  Switch variants: ?variant=cabinet|marquee|combo or the bottom bar (←/→).
  Each renders both SCREENS — toggle with the Detail / Make the Call tabs, and
  flip the real viewerContext states (open / grace / called / own jump + disputes).

<style>
/* ═══════════ SEMANTIC TOKENS (roles, not decoration) ═══════════
   Contrast verified: deep-ink on tray-white 15.8:1 · white on taco-purple 9.9:1
   white on pizza-red 4.33:1 (AA large/bold only) · deep-ink on baja-teal 5.6:1
   (white-on-teal FAILS at 3.0 — teal/blue/green/yellow never carry white text). */
:root{
  --taco-purple:#5B2A86; --baja-teal:#00A6A6; --pizza-red:#E13A2D;
  --nacho-yellow:#FFC928; --hot-pink:#F15BB5; --deep-ink:#211A2E;

  --ui:"Nunito Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#15131c; font-family:var(--ui); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:26px 16px 150px;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:22px 22px;
}

/* ── Prototype phone frame (NOT part of any design) ── */
.device{width:390px; max-width:100%; height:844px; border-radius:46px; background:#000;
  padding:12px; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.05);
  position:relative; flex:none;}
.device::after{content:""; position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:130px; height:26px; background:#000; border-radius:0 0 18px 18px; z-index:80;}
.screen{width:100%; height:100%; border-radius:35px; overflow-y:auto; overflow-x:hidden;
  position:relative; -webkit-overflow-scrolling:touch; background:var(--tray-white);}
.screen::-webkit-scrollbar{width:0}

/* ── Variant switcher (NOT part of any design) ── */
#switcher{position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  display:flex; align-items:stretch; gap:2px; background:#fff; border-radius:999px; padding:5px;
  box-shadow:0 10px 40px rgba(0,0,0,.5), 0 0 0 3px rgba(0,0,0,.85); z-index:1000;
  font-family:var(--mono); user-select:none;}
#switcher button{border:0; background:#111; color:#fff; cursor:pointer; width:40px;

#switcher button:hover{background:var(--pizza-red)}
#switcher .label{padding:8px 14px; color:#111; font-weight:700; font-size:12px; white-space:nowrap;

#switcher .label .key{font-size:10px; opacity:.55; letter-spacing:2px}

/* ── State bar (NOT part of any design) ── */
#statebar{position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:4px;

#statebar button.on{background:var(--nacho-yellow); color:#111}
#statebar .cap{font-size:8px; color:rgba(255,255,255,.4); padding:2px 4px 0;

  #statebar .cap{padding:0 4px}
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }

<body>
  <div class="device"><div class="screen" id="screen"></div></div>

  <div id="switcher">
    <div class="label"><span class="key" id="vkey"></span><span class="name" id="vname"></span></div>
  </div>

  <div id="statebar">
    <span class="cap">screen</span>
    <div class="grp">
      <button data-screen="detail" class="on">Jump Detail</button>
      <button data-screen="call">Make the Call</button>
    </div>
    <span class="cap">viewer state</span>
    <div class="grp">
      <button data-state="open" class="on">Can call</button>
      <button data-state="grace">Grace</button>
    </div>
    <div class="grp">
      <button data-state="called">Called</button>
      <button data-state="self">Own jump</button>
    </div>
    <span class="cap">extras</span>
    <div class="grp">
      <button data-extra="disputes">Disputes</button>
      <button data-extra="final">Final score</button>
    </div>
  </div>

<script>
/* ═══════════ SHARED MOCK PAYLOAD (mirrors JumpDetail schema) ═══════════ */
const JUMP = {
  number: 42,
  performerName: "marcus_t",
  source: "Taco Bell",
  destination: "Hotel lobby bar",
  food: "Crunchwrap Supreme",
  caption: "Ordered a Manhattan, unwrapped this with full eye contact, asked the bartender to pair it. He did. Nobody harmed, nobody fled — just full commitment to the bit.",
  mediaUrl: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=900&q=70",
  createdAt: "2026-06-01T19:42:00Z",
  gracePeriodEndsAt: new Date(Date.now() + 7*60000 + 12000).toISOString(),
  runningAverage: 3.4,
  callCount: 11,
  finalScore: 3.6,
  // CONTEXT.md scoring factors — labelled by FEEL, not verdict (audience, not panel).
  factors: [
    { key:"commitment",    label:"Commitment",    avg:3.8, hype:"no notes" },
    { key:"transgression", label:"Transgression", avg:3.1, hype:"a true menace" },
    { key:"creativity",    label:"Creativity",    avg:3.5, hype:"unhinged (affectionate)" },
    { key:"presentation",  label:"Presentation",  avg:2.9, hype:"plated with intent" },
  ],
  disputes: [ { category:"Credibility", note:"Is that actually a hotel bar or a chain restaurant?" } ],
};

const STATE = { screen:"detail", viewer:"open", disputes:false, final:false };

/* ── shared helpers ── */
function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function graceText(){
  const ms = new Date(JUMP.gracePeriodEndsAt).getTime() - Date.now();
  if (ms <= 0) return "Calls open";
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
  return `${m}:${String(s).padStart(2,"0")}`;
}
// {mode,label,sub} for the call affordance given STATE.viewer + new copy.
function callAffordance(){
  switch(STATE.viewer){
    case "grace":  return { mode:"grace",  label:`Calls open in ${graceText()}`, sub:"Author's grace period" };
    case "called": return { mode:"called", label:"Your call is on the board", sub:"Nice. Next Jump?" };
    case "self":   return { mode:"self",   label:"This one's yours — sit back", sub:"You can't call your own Jump" };
    default:       return { mode:"open",   label:"Make the Call", sub:"React to the bit, then lock it in" };
  }
}
// Score window count-up — the "machine tallying coins." ≤240ms feel, ticks integers-ish.
function countUp(node, target, dur=900){
  if(!node) return;
  // reduced-motion: set instantly, never animate (Whimsy consult).
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ node.textContent = target.toFixed(1); return; }
  const start = performance.now();
  (function step(t){
    const p = Math.min(1,(t-start)/dur), eased = 1-Math.pow(1-p,3);
    node.textContent = (target*eased).toFixed(1);
    if(p<1) requestAnimationFrame(step); else node.textContent = target.toFixed(1);
  })(performance.now());
}
function tickGrace(node){
  if(!node) return;
  const iv = setInterval(()=>{
    if(!document.body.contains(node)){ clearInterval(iv); return; }
    node.textContent = graceText();
    if(node.textContent === "Calls open") clearInterval(iv);
  },1000);
}
// Contained prize-ticket confetti burst (decorative, never blocks "Next Jump?").
function confettiBurst(host){
  const colors = ["var(--nacho-yellow)","var(--hot-pink)","var(--baja-teal)","var(--lettuce-green)"];
  for(let i=0;i<5;i++){
    const s = document.createElement("span");
    s.className="confetti";
    s.style.background = colors[i%colors.length];
    s.style.setProperty("--dx", (Math.cos(i/5*6.28)*42).toFixed(0)+"px");
    s.style.setProperty("--dy", (-30 - Math.random()*24).toFixed(0)+"px");
    s.style.setProperty("--rot", (Math.random()*180-90).toFixed(0)+"deg");
    host.appendChild(s);
    s.addEventListener("animationend", ()=>s.remove());
  }
}

const VARIANTS = {};
</script>

<!-- ════════════════════════════════════════════════════════════════════════
     SHARED ARCADE PRIMITIVES — the "Make the Call" move + result panel.
     One implementation, reused across variants so the move is identical and the
     variants differ only on COMPOSITION (the real research axis). Each variant
     supplies its own Jump Detail skin and calls these for the call flow.
     ════════════════════════════════════════════════════════════════════════ -->
<style>
/* shared confetti (contained to the ticket area) */
.confetti{position:absolute; left:50%; top:40%; width:8px; height:12px; border-radius:2px;
  pointer-events:none; z-index:5; animation:confetti .34s ease-out forwards;}
@keyframes confetti{
  0%{transform:translate(-50%,0) rotate(0); opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)), var(--dy)) rotate(var(--rot)); opacity:0}
}

/* ── THE MAKE THE CALL flow (shared) — Marquee treatment ──
   Full-bleed hero of the friend's bit, then an opaque order-board deck that
   crops up into the lower portion and carries all the scoring. Same
   composition language as the winning Jump Detail variant. */
.mc{min-height:100%; background:var(--tray-white); color:var(--deep-ink); position:relative; overflow:hidden;}

/* full-bleed hero (the bit being called) */
.mc-hero{position:relative; height:300px;}
.mc-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(1.08) contrast(1.04);}
.mc-hero-top{position:absolute; top:52px; left:16px; right:16px; display:flex; justify-content:space-between; z-index:3;}
.mc-tag{font-family:var(--ui); font-weight:800; font-size:11px; padding:5px 10px; border-radius:8px;
  border:2px solid var(--deep-ink); background:var(--pizza-red); color:#fff;}

/* opaque deck cropping up over the hero — carries comprehension */
.mc-deck{position:relative; margin-top:-58px; background:var(--tray-white); border-top:4px solid var(--taco-purple);
  border-radius:22px 22px 0 0; padding:20px 18px 40px; z-index:2; min-height:300px;}
.mc-tab{position:absolute; top:-18px; left:24px; background:var(--taco-purple); color:#fff;
  font-family:var(--display); font-size:13px; padding:6px 14px; border-radius:10px 10px 0 0;}
/* reserve the top-right gutter so the score window never overlaps the heading */
.mc-eyebrow{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--taco-purple); padding-right:90px;}
.mc-h{font-family:var(--display); font-size:24px; line-height:1; margin:4px 0 2px; padding-right:90px;}
.mc-who{font-family:var(--ui); font-size:13px; font-weight:700; color:var(--ink-muted); margin-bottom:14px;}
.mc-who b{color:var(--deep-ink)}
.mc-cap{font-size:14px; line-height:1.45; color:#3a3142; margin:8px 0 16px;}

/* score window (top-right "arcade readout"), anchored to the deck */
.mc-window{position:absolute; top:-14px; right:18px; background:var(--deep-ink); border-radius:12px;
  padding:8px 12px 7px; text-align:center; min-width:74px; border:3px solid var(--deep-ink);
  box-shadow:4px 4px 0 var(--taco-purple); z-index:4;}
.mc-window .n{font-family:var(--display); font-size:26px; line-height:.9; color:var(--nacho-yellow);}
.mc-window .l{font-family:var(--mono); font-size:8px; letter-spacing:1.5px; color:rgba(255,255,255,.6); text-transform:uppercase;}

/* the 4 factor rows — chunky pip buttons */
.mc-factor{margin:14px 0;}
.mc-factor-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
.mc-factor-name{font-family:var(--ui); font-weight:800; font-size:16px;}
.mc-hype{font-family:var(--ui); font-weight:800; font-size:12px; color:var(--pizza-red);
  opacity:0; transform:translateY(2px); transition:none;}
.mc-hype.show{animation:hypePop .13s cubic-bezier(.34,1.4,.64,1) forwards, hypeFade .25s ease .4s forwards;}
@keyframes hypePop{to{opacity:1; transform:translateY(0) scale(1)} from{opacity:0; transform:translateY(2px) scale(.9)}}
@keyframes hypeFade{to{opacity:0}}
.mc-pips{display:flex; gap:8px;}
.mc-pip{flex:1; height:54px; border:3px solid var(--deep-ink); border-radius:12px; background:#fff;
  font-family:var(--display); font-size:18px; color:var(--deep-ink); cursor:pointer; position:relative;
  box-shadow:0 4px 0 var(--deep-ink); transition:transform .07s, box-shadow .07s;}
.mc-pip:active{transform:translateY(4px); box-shadow:0 0 0 var(--deep-ink);}
.mc-pip.lit{color:var(--deep-ink);}
.mc-pip.lit.f0{background:var(--cup-blue)} .mc-pip.lit.f1{background:var(--baja-teal)}
.mc-pip.lit.f2{background:var(--nacho-yellow)} .mc-pip.lit.f3{background:var(--lettuce-green)}
.mc-pip.pop{animation:pipPop .13s cubic-bezier(.34,1.4,.64,1);}
@keyframes pipPop{50%{transform:scale(1.16)}}

/* the lock-in button — injection-molded arcade button with a real throw */
.mc-lock{display:block; width:100%; border:0; cursor:pointer; font-family:var(--ui); font-weight:800;
  font-size:19px; letter-spacing:.5px; color:#fff; background:var(--pizza-red); padding:18px;
  border-radius:16px; border:3px solid var(--deep-ink); box-shadow:0 7px 0 var(--deep-ink);
  margin-top:18px; transition:transform .07s, box-shadow .07s;}
.mc-lock:active{transform:translateY(7px); box-shadow:0 0 0 var(--deep-ink);}
.mc-lock.wait{animation:wobble .2s ease-in-out;}
@keyframes wobble{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.mc-locksub{text-align:center; font-family:var(--mono); font-size:11px; color:var(--ink-muted);
  margin-top:10px; font-weight:600;}

/* disabled / non-open states */
.mc-state{margin-top:18px; border:3px solid var(--deep-ink); border-radius:16px; padding:20px;
  text-align:center; background:#fff; box-shadow:0 7px 0 var(--taco-purple);}
.mc-state.grace{background:var(--taco-purple); color:#fff; border-color:var(--deep-ink);}
.mc-state .big{font-family:var(--display); font-size:30px; line-height:1;}
.mc-state .small{font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  opacity:.85; margin-top:6px;}

/* the prize-ticket result (completion delight) */
.mc-ticket{position:relative; margin-top:20px; background:var(--deep-ink); color:#fff; border-radius:16px;
  padding:22px 20px; text-align:center; overflow:visible; animation:ticketUp .18s ease-out both;}
@keyframes ticketUp{from{transform:translateY(16px); opacity:0} to{transform:translateY(0); opacity:1}}
/* perforation notches — FAKE via tray-white circles (RN-honest: solid bg only, never over photo) */
.mc-ticket::before,.mc-ticket::after{content:""; position:absolute; width:22px; height:22px;
  border-radius:50%; background:var(--tray-white); top:50%; transform:translateY(-50%);}
.mc-ticket::before{left:-11px} .mc-ticket::after{right:-11px}
.mc-ticket .stamp{display:inline-block; font-family:var(--display); font-size:13px; letter-spacing:2px;
  color:var(--nacho-yellow); border:3px solid var(--nacho-yellow); border-radius:8px; padding:5px 12px;
  transform:rotate(-4deg); margin-bottom:10px;}
.mc-ticket .total{font-family:var(--display); font-size:44px; line-height:.9; color:#fff;}
.mc-ticket .board{font-family:var(--ui); font-weight:700; font-size:13px; color:rgba(255,255,255,.75); margin-top:8px;}
.mc-next{display:block; width:100%; border:0; cursor:pointer; font-family:var(--ui); font-weight:800;
  font-size:16px; color:var(--deep-ink); background:var(--nacho-yellow); padding:15px; border-radius:14px;
  border:3px solid var(--deep-ink); box-shadow:0 6px 0 var(--deep-ink); margin-top:14px;
  transition:transform .07s, box-shadow .07s;}
.mc-next:active{transform:translateY(6px); box-shadow:0 0 0 var(--deep-ink);}
</style>
<script>
/* The shared Make the Call flow (Marquee treatment): full-bleed hero of the bit
   being called, then an opaque order-board deck carrying the scoring. */
function renderMakeTheCall(host){
  const aff = callAffordance();
  const hero = `
    <div class="mc-hero">
      <img src="${JUMP.mediaUrl}" alt="${JUMP.food} at ${JUMP.destination}">
      <div class="mc-hero-top"><span></span><span class="mc-tag">JUMP #0${JUMP.number}</span></div>
    </div>`;

  if (aff.mode !== "open"){
    // grace / called / self all resolve to a single result panel with new copy.
    host.innerHTML = `
      ${hero}
      <div class="mc-deck">
        <div class="mc-tab">Make the Call</div>
        <div class="mc-h">${JUMP.food}</div>
        <div class="mc-who">by <b>@${JUMP.performerName}</b> · ${JUMP.source} → ${JUMP.destination}</div>
        ${ aff.mode==="grace" ? `
          <div class="mc-state grace"><div class="big" id="mc-grace">${graceText()}</div><div class="small">${aff.sub}</div></div>
          <div class="mc-locksub">The author can still tweak it. Calls open when the clock runs out.</div>
        ` : aff.mode==="called" ? `
          <div class="mc-ticket">
            <span class="stamp">CALL LOCKED</span>
            <div class="total">${JUMP.runningAverage.toFixed(1)}</div>
            <div class="board">Your call is on the board.</div>
          </div>
          <button class="mc-next">Nice. Next Jump? →</button>
        ` : `
          <div class="mc-state"><div class="big">Sit back</div><div class="small">${aff.sub}</div></div>
          <div class="mc-locksub">Performers don't call their own bit — let the crowd react.</div>
        `}
      </div>`;
    if (aff.mode==="grace") tickGrace(host.querySelector("#mc-grace"));
    return;
  }

  // OPEN: the real scoring move.
  host.innerHTML = `
    ${hero}
    <div class="mc-deck">
      <div class="mc-window"><div class="n" id="mc-win">0.0</div><div class="l">your call</div></div>
      <div class="mc-tab">Make the Call</div>
      <div class="mc-h">${JUMP.food}</div>
      <div class="mc-who">by <b>@${JUMP.performerName}</b> · ${JUMP.source} → ${JUMP.destination}</div>
      <div class="mc-cap">${JUMP.caption}</div>
      <div id="mc-factors">
      ${JUMP.factors.map((f,i)=>`
        <div class="mc-factor" data-f="${i}">
          <div class="mc-factor-top">
            <span class="mc-factor-name">${f.label}</span>
            <span class="mc-hype" data-hype="${i}"></span>
          </div>
          <div class="mc-pips">
            ${[1,2,3,4].map(n=>`<button class="mc-pip" data-f="${i}" data-n="${n}" aria-label="${f.label} ${n}">${n}</button>`).join("")}
          </div>
        </div>`).join("")}
    </div>
      <button class="mc-lock" id="mc-lock">Make the Call</button>
      <div class="mc-locksub" id="mc-locksub">React to the bit, then lock it in</div>
    </div>`;

  const picks = {};
  const winNode = host.querySelector("#mc-win");
  const lock = host.querySelector("#mc-lock");
  const locksub = host.querySelector("#mc-locksub");

  function refreshWindow(){
    const vals = Object.values(picks);
    if (!vals.length){ winNode.textContent = "0.0"; return; }
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    winNode.textContent = avg.toFixed(1);
    if (Object.keys(picks).length === 4) lock.textContent = "Lock It In";
  }

  host.querySelectorAll(".mc-pip").forEach(p=>{
    p.addEventListener("click",()=>{
      const fi = p.dataset.f, n = +p.dataset.n;
      picks[fi] = n;
      const row = host.querySelector(`.mc-factor[data-f="${fi}"]`);
      row.querySelectorAll(".mc-pip").forEach(x=>{
        x.classList.remove("lit","f0","f1","f2","f3","pop");
        if (+x.dataset.n <= n) x.classList.add("lit","f"+fi);
      });
      void p.offsetWidth; p.classList.add("pop");
      // hype caption only on a top mark (4) — a friend hyping, not a rubric.
      if (n === 4){
        const h = row.querySelector(`.mc-hype[data-hype="${fi}"]`);
        h.textContent = JUMP.factors[fi].hype;
        h.classList.remove("show"); void h.offsetWidth; h.classList.add("show");
      }
      refreshWindow();
    });
  });

  lock.addEventListener("click",()=>{
    if (Object.keys(picks).length < 4){
      lock.classList.remove("wait"); void lock.offsetWidth; lock.classList.add("wait");
      locksub.textContent = "Call all four first — then lock it in";
      return;
    }
    const avg = (Object.values(picks).reduce((a,b)=>a+b,0)/4).toFixed(1);
    const factors = host.querySelector("#mc-factors");
    factors.style.opacity = ".45"; factors.style.pointerEvents = "none";
    lock.outerHTML = `
      <div class="mc-ticket" id="mc-ticket">
        <span class="stamp">CALL LOCKED</span>
        <div class="total" id="mc-total">${avg}</div>
        <div class="board">Your call is on the board.</div>
      </div>
      <button class="mc-next">Nice. Next Jump? →</button>`;
    locksub.remove();
    // contained celebration — never blocks the already-tappable Next Jump.
    confettiBurst(host.querySelector("#mc-ticket"));
    // re-aim the top score window to the locked total.
    countUp(winNode, +avg, 240);
  });
}
</script>

<!-- ════════════════════════════════════════════════════════════════════════
     VARIANT: MARQUEE — full-bleed cinematic photo (D's food-as-centerpiece),
     with an OPAQUE order-board deck cropping up into the lower third. Most
     cinematic. Tests: does the crop-line read as intentional structure?
     ════════════════════════════════════════════════════════════════════════ -->
<style>
.mq{min-height:100%; background:var(--tray-white); color:var(--deep-ink); position:relative; overflow:hidden;}
.mq-hero{position:relative; height:430px;}
.mq-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(1.08) contrast(1.04);}
/* top corner badges sit on tiny SOLID plates, never raw on the photo */
.mq-top{position:absolute; top:52px; left:16px; right:16px; display:flex; justify-content:space-between; z-index:3;}
.mq-tag{font-family:var(--ui); font-weight:800; font-size:11px; padding:5px 10px; border-radius:8px;
  border:2px solid var(--deep-ink); background:var(--tray-white); color:var(--deep-ink);}
.mq-tag.live{background:var(--pizza-red); color:#fff; border-color:var(--deep-ink);}
/* the order-board deck — fully OPAQUE plate, crisp purple lip + notch tab */
.mq-deck{position:relative; margin-top:-58px; background:var(--tray-white); border-top:4px solid var(--taco-purple);
  border-radius:22px 22px 0 0; padding:20px 18px 36px; z-index:2;}
.mq-tab{position:absolute; top:-18px; left:24px; background:var(--taco-purple); color:#fff;
  font-family:var(--display); font-size:13px; padding:6px 14px; border-radius:10px 10px 0 0;}
.mq-route{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:1px; color:var(--taco-purple);
  text-transform:uppercase;}
.mq-food{font-family:var(--display); font-size:30px; line-height:.98; margin:6px 0 2px;}
.mq-sub{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 4px;}
.mq-chip{font-family:var(--ui); font-weight:700; font-size:12px; padding:5px 10px; border-radius:999px;
  border:2px solid var(--deep-ink); background:#fff;}
.mq-status{display:inline-flex; align-items:center; gap:6px; font-family:var(--ui); font-weight:800; font-size:12px;
  padding:5px 11px; border-radius:999px; border:2px solid var(--deep-ink); background:var(--baja-teal); color:var(--deep-ink);}
.mq-status .dot{width:8px; height:8px; border-radius:50%; background:var(--deep-ink); animation:mqPulse 1.3s ease-in-out infinite;}
@keyframes mqPulse{50%{opacity:.25; transform:scale(.7)}}
/* closed = muted, no dot, no pulse — recognizably different from open */
.mq-status.closed{background:#e7ddcb; color:var(--ink-muted); border-color:#cabfa9;}
.mq-status.closed .dot{display:none;}
.mq-cap{font-size:14px; line-height:1.5; color:#3a3142; margin:12px 0;}
/* score window */
.mq-score{display:flex; align-items:center; justify-content:space-between; background:var(--deep-ink);
  border-radius:16px; padding:14px 18px; color:#fff;}
.mq-score .n{font-family:var(--display); font-size:42px; line-height:.85; color:var(--nacho-yellow)}
.mq-score .l{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.65)}
.mq-score .r{text-align:right; font-family:var(--mono); font-size:11px; color:rgba(255,255,255,.7)}
.mq-cta{display:block; width:100%; border:0; cursor:pointer; font-family:var(--ui); font-weight:800; font-size:18px;
  color:#fff; background:var(--pizza-red); padding:17px; border-radius:14px; border:3px solid var(--deep-ink);
  box-shadow:0 6px 0 var(--deep-ink); margin-top:14px; transition:transform .07s, box-shadow .07s;}
.mq-cta:active{transform:translateY(6px); box-shadow:0 0 0 var(--deep-ink)}
.mq-cta.off{background:#ece3d2; color:#9a8f7c; border-color:#cabfa9; box-shadow:0 6px 0 #cabfa9; cursor:default}
.mq-ctasub{text-align:center; font-family:var(--mono); font-size:11px; color:var(--ink-muted); margin-top:9px; font-weight:600}
.mq-dispute{margin-top:14px; background:#fff; border:3px solid var(--deep-ink); border-radius:12px; padding:11px 13px}
.mq-dispute .h{font-family:var(--ui); font-weight:800; font-size:12px; color:var(--pizza-red)}
.mq-dispute .n{font-size:13px; color:#3a3142; margin-top:3px}
</style>
<script>
VARIANTS.marquee = {
  name: "Marquee (full-bleed hero + deck)",
  detail(el){
    const aff = callAffordance();
    const final = STATE.final;
    el.innerHTML = `
    <div class="mq">
      <div class="mq-hero">
        <img src="${JUMP.mediaUrl}" alt="${JUMP.food} at ${JUMP.destination}">
        <div class="mq-top">
          <span></span>
          <span class="mq-tag ${final?'':'live'}">${final?'LOCKED IN':'LIVE'}</span>
        </div>
      </div>
      <div class="mq-deck">
        <div class="mq-tab">The Order</div>
        <div class="mq-route">Jump #0${JUMP.number} · ${JUMP.source} → ${JUMP.destination}</div>
        <div class="mq-food">${JUMP.food}</div>
        <div class="mq-sub">
          <span class="mq-chip">@${JUMP.performerName}</span>
          <span class="mq-status ${final?'closed':''}"><span class="dot"></span>${final?'Calls closed':'Calls open'}</span>
        </div>
        <div class="mq-cap">${JUMP.caption}</div>
        <div class="mq-score">
          <div><div class="l">${final?'Final score':'Running avg'}</div><div class="n" id="mq-num">0.0</div></div>
          <div class="r">${JUMP.callCount} calls in<br>out of 4.0</div>
        </div>
        ${STATE.disputes?`<div class="mq-dispute"><div class="h">⚑ ${JUMP.disputes[0].category} flagged</div><div class="n">${JUMP.disputes[0].note}</div></div>`:``}
        ${ aff.mode==="open"
          ? `<button class="mq-cta" id="mq-cta">Make the Call</button><div class="mq-ctasub">${aff.sub}</div>`
          : `<button class="mq-cta off">${aff.label}</button><div class="mq-ctasub">${aff.sub}</div>` }
      </div>
    </div>`;
    countUp(el.querySelector("#mq-num"), final?JUMP.finalScore:JUMP.runningAverage);
    const cta = el.querySelector("#mq-cta");
    if (cta) cta.onclick = ()=>{ STATE.screen="call"; syncStatebar(); render(); };
  },
  call(el){ const w = document.createElement("div"); w.className="mc"; el.appendChild(w); renderMakeTheCall(w); }
};
</script>

<!-- ═══════════ BOOT + SWITCHER + STATE BAR (prototype frame) ═══════════ -->
<script>
const ORDER = ["marquee"];   // Marquee is the chosen direction; the others were dropped post-verdict.
const screen = document.getElementById("screen");

function currentVariant(){
  const v = new URLSearchParams(location.search).get("variant");
  return ORDER.includes(v) ? v : "marquee";
}
function applyUrlState(){
  const q = new URLSearchParams(location.search);
  const sc = q.get("screen"); if (["detail","call"].includes(sc)) STATE.screen = sc;
  const st = q.get("state");  if (["open","grace","called","self"].includes(st)) STATE.viewer = st;
  if (q.has("disputes")) STATE.disputes = q.get("disputes")!=="0";
  if (q.has("final"))    STATE.final    = q.get("final")!=="0";
  syncStatebar();
}
function syncStatebar(){
  document.querySelectorAll('#statebar button[data-screen]').forEach(b=>b.classList.toggle("on", b.dataset.screen===STATE.screen));
  document.querySelectorAll('#statebar button[data-state]').forEach(b=>b.classList.toggle("on", b.dataset.state===STATE.viewer));
  document.querySelector('#statebar button[data-extra="disputes"]').classList.toggle("on", STATE.disputes);
  document.querySelector('#statebar button[data-extra="final"]').classList.toggle("on", STATE.final);
}
function render(){
  const key = currentVariant();
  const v = VARIANTS[key];
  document.getElementById("vkey").textContent = key.toUpperCase();
  document.getElementById("vname").textContent = v ? v.name : "(missing)";
  screen.scrollTop = 0; screen.innerHTML = "";
  if (!v){ screen.innerHTML = `<div style="padding:40px;font-family:monospace">Variant ${key} not built.</div>`; return; }
  if (STATE.screen === "call") v.call(screen); else v.detail(screen);
}
document.querySelectorAll('#statebar button[data-screen]').forEach(b=>b.onclick=()=>{ STATE.screen=b.dataset.screen; syncStatebar(); render(); });
document.querySelectorAll('#statebar button[data-state]').forEach(b=>b.onclick=()=>{ STATE.viewer=b.dataset.state; syncStatebar(); render(); });
document.querySelectorAll('#statebar button[data-extra]').forEach(b=>b.onclick=()=>{ STATE[b.dataset.extra]=!STATE[b.dataset.extra]; syncStatebar(); render(); });

applyUrlState();
render();
</script>
</body>
