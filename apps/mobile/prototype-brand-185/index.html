<script>
/* ═══════════════ SHARED MOCK PAYLOAD (one Jump, every variant) ═══════════════
   Mirrors the JumpDetail schema (packages/api-client/src/generated.d.ts) and the
   fields JumpDetailScreen.tsx actually reads. Read-only — no real fetch. */

const JUMP = {
  id: "jump_042",
  number: 42,
  performerName: "marcus_t",
  performerId: "p_marcus",
  source: "Taco Bell",
  destination: "Hotel lobby bar",
  food: "Crunchwrap Supreme",
  caption: "Ordered a Manhattan, unwrapped this with full eye contact, asked the bartender to pair it. He did. House Rules respected — nobody harmed, no trespass, just commitment.",
  // a real disposable-camera-ish food photo (Unsplash, hotlinked for the throwaway)
  mediaUrl: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=900&q=70",
  status: "Judged Jump",
  createdAt: "2026-06-01T19:42:00Z",
  gracePeriodEndsAt: new Date(Date.now() + 7 * 60000 + 12000).toISOString(), // ~7m out
  runningAverage: 3.4,
  judgmentCount: 11,
  finalScore: 3.6,
  // The four canonical scoring factors (CONTEXT.md), each 1–4.
  criteria: [
    { key: "commitment",   label: "Commitment",   avg: 3.8, blurb: "Sold the bit deadpan" },
    { key: "transgression",label: "Transgression",avg: 3.1, blurb: "Wrong food, wrong room" },
    { key: "creativity",   label: "Creativity",   avg: 3.5, blurb: "The pairing request" },
    { key: "presentation", label: "Presentation", avg: 2.9, blurb: "Photo could be sharper" },
  ],
  disputes: [
    { category: "Credibility", note: "Is that actually a hotel bar or a chain restaurant?" },
  ],
};

/* viewerContext is driven by the state bar so each design is tested against the
   judging affordance's REAL states, not just the happy path. */
const STATE = {
  viewer: "open",        // open | grace | judged | self
  disputes: false,
  final: false,
};

// Helpers shared across variants -------------------------------------------------
function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function graceCountdownText(){
  const ms = new Date(JUMP.gracePeriodEndsAt).getTime() - Date.now();
  if (ms <= 0) return "Judging open";
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
  return `${m}m ${String(s).padStart(2,"0")}s`;
}
// Returns {label, mode} for the judging affordance given STATE.viewer.
function judgeAffordance(){
  switch(STATE.viewer){
    case "grace":  return { mode:"grace",  label:`Judging opens in ${graceCountdownText()}`, sub:"Author grace period" };
    case "judged": return { mode:"judged", label:"You judged this Jump", sub:"Score added to the board" };
    case "self":   return { mode:"self",   label:"You can't judge your own Jump", sub:"Performers don't judge" };
    default:       return { mode:"open",   label:"Judge It", sub:"Drop a score in each slot" };
  }
}

// Animated count-up for score values (the "prize-ticket counter" motion).
function countUp(elNode, target){
  if (!elNode) return;
  const dur = 900, start = performance.now();
  function step(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    elNode.textContent = (target * eased).toFixed(1);
    if (p < 1) requestAnimationFrame(step);
    else elNode.textContent = target.toFixed(1);
  }
  requestAnimationFrame(step);
}
// Live grace-period ticker; stops + relabels when it hits zero.
function tickGrace(elNode){
  if (!elNode) return;
  const iv = setInterval(()=>{
    if (!document.body.contains(elNode)){ clearInterval(iv); return; }
    const txt = graceCountdownText();
    elNode.textContent = txt;
    if (txt === "Judging open") clearInterval(iv);
  }, 1000);
}

/* ═══════════════ VARIANT REGISTRY ═══════════════
   Each entry: { name, render(screenEl) }. render() owns the full subtree —
   no shared layout component (per prototype rules). Defined below. */
const VARIANTS = {};

<style>

<script>
VARIANTS.A = {
  name: "Food Court Arcade",
  render(el){
    const aff = judgeAffordance();
    const showFinal = STATE.final;
    el.innerHTML = `
    <div class="vA"><div class="vA-in">
      <div class="vA-marquee">
        <span><span class="dot"></span>${showFinal ? "FINAL SCORE" : "OPEN FOR JUDGING"}</span>
        <span>FOOD COURT · OPEN 24H</span>
      </div>

      <div class="vA-card">
        <div class="vA-banner">
          <div class="vA-kicker">JUMP FILED</div>
          <div class="vA-jumpno">JUMP #0${JUMP.number}</div>
          <div class="vA-chip-open">${showFinal ? "LOCKED IN" : "LIVE"}</div>
        </div>

        <div class="vA-evi">
          <div class="vA-evi-frame">
            <img src="${JUMP.mediaUrl}" alt="${JUMP.caption}" />
            <div class="vA-evi-stamp">${fmtDate(JUMP.createdAt)}</div>
          </div>
          <div class="vA-evi-tag">📎 EVIDENCE PACK · 2 photos · 1 caption</div>
        </div>

        <div class="vA-section">
          <div class="vA-h">The Order</div>
          <div class="vA-route"><span>${JUMP.source}</span><span class="arrow">→</span><span>${JUMP.destination}</span></div>
          <div class="vA-food">${JUMP.food}</div>
          <div class="vA-perf"><b>@${JUMP.performerName}</b><span class="ts">· ${fmtDate(JUMP.createdAt)}</span></div>
          <div class="vA-h">The Move</div>
          <div class="vA-cap">${JUMP.caption}</div>
        </div>

        <div class="vA-perf-edge"></div>
      </div>

      <div class="vA-score-ticket">
        <div>
          <div class="vA-score-l">${showFinal ? "Final Score" : "Running Average"}</div>
          <div class="vA-score-n" id="vA-num">0.0</div>
          <div class="vA-score-sub">from ${JUMP.judgmentCount} judgments</div>
        </div>
        <div style="text-align:right">
          ${showFinal ? `<div class="vA-score-final">OPEN FINAL</div>` : `<div class="vA-score-l">/ 4.0</div>`}
        </div>
      </div>

      ${STATE.disputes ? `<div class="vA-dispute"><div class="h">⚑ ${JUMP.disputes.length} dispute · ${JUMP.disputes[0].category}</div><div class="n">${JUMP.disputes[0].note}</div></div>` : ``}

      <div class="vA-judge-wrap">
        <div class="vA-h">Judging</div>
        ${aff.mode === "open" ? `
          <div class="vA-slots">
            ${JUMP.criteria.map((c,i)=>`
              <div class="vA-slot" data-slot="${i}">
                <div class="name">${c.label}</div>
                <div class="blurb">${c.blurb}</div>
                <div class="vA-pips">
                  ${[1,2,3,4].map(n=>`<button class="vA-pip" data-c="${i}" data-n="${n}">${n}</button>`).join("")}
                </div>
              </div>`).join("")}
          </div>
          <button class="vA-cta" id="vA-lock">LOCK IT IN</button>
          <div class="vA-cta-sub">Drop a chip in each slot, then lock</div>
        ` : aff.mode === "grace" ? `
          <div class="vA-grace"><div class="t" id="vA-grace">${graceCountdownText()}</div><div class="l">${aff.sub}</div></div>
        ` : `
          <button class="vA-cta disabled">${aff.label}</button>
          <div class="vA-cta-sub">${aff.sub}</div>
          ${aff.mode === "judged" ? `<div class="vA-stamp"><span class="badge">LOCKED IN</span></div>` : ``}
        `}
      </div>
    </div></div>`;

    // prize-ticket count-up
    countUp(el.querySelector("#vA-num"), showFinal ? JUMP.finalScore : JUMP.runningAverage);

    // grace ticker
    if (aff.mode === "grace") tickGrace(el.querySelector("#vA-grace"));

    // chip drop interaction → enables LOCK IT IN, then stamps
    if (aff.mode === "open"){
      const picks = {};
      el.querySelectorAll(".vA-pip").forEach(p=>{
        p.addEventListener("click",()=>{
          const ci = p.dataset.c, n = +p.dataset.n;
          picks[ci] = n;
          const slot = el.querySelector(`.vA-slot[data-slot="${ci}"]`);
          slot.querySelectorAll(".vA-pip").forEach(x=>{
            x.classList.remove("filled","c0","c1","c2","c3","dropped");
            if (+x.dataset.n <= n){ x.classList.add("filled","c"+(n-1)); }
          });
          p.classList.add("dropped");
        });
      });
      const lock = el.querySelector("#vA-lock");
      lock.addEventListener("click",()=>{
        if (Object.keys(picks).length < 4){
          lock.textContent = "DROP ALL 4 FIRST"; lock.style.background="var(--sj-taco-purple)";
          setTimeout(()=>{lock.textContent="LOCK IT IN";lock.style.background="";},900);
          return;
        }
        el.querySelector(".vA-slots").style.opacity=".5";
        lock.outerHTML = `<button class="vA-cta disabled">JUDGMENT FILED</button><div class="vA-stamp"><span class="badge">LOCKED IN</span></div>`;
      });
    }
  }
};
</script>

<!-- ═══════════════════════════════════════════════════════════════════════

<style>

  position:relative;overflow:hidden;padding:50px 16px 28px;}
.vC::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;

.vC-in{position:relative;z-index:1;}

/* the photo — disposable camera frame, timestamp burned in */

.vC-photo .ts{position:absolute;bottom:14px;right:16px;font-family:"IBM Plex Mono",monospace;
  color:#ffb000;font-size:13px;text-shadow:0 0 4px rgba(255,176,0,.6);letter-spacing:1px;}
.vC-tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);

.vC-fields{margin:14px 2px;font-size:13px;line-height:1.7;}
.vC-fields .k{font-size:10px;letter-spacing:2px;color:#6b5f50;}
.vC-fields .v{font-weight:bold;border-bottom:1px dotted #9a907c;display:inline-block;min-width:60%;}
.vC-cap{font-family:"Caveat",cursive;font-size:21px;line-height:1.25;color:#1c2a6b;margin:10px 6px;
  transform:rotate(-.6deg);}
.vC-by{font-size:10px;letter-spacing:1px;color:#6b5f50;margin:0 2px;}

/* score as a typed report line */
.vC-scoreline{margin:14px 2px 6px;border-top:2px solid #2a2620;border-bottom:2px solid #2a2620;padding:10px 0;
  display:flex;justify-content:space-between;align-items:center;}

  transform:rotate(-6deg);opacity:.85;}
.vC-dispute{margin-top:10px;font-size:11px;border:1px solid var(--sj-pizza-red);padding:8px;color:var(--sj-pizza-red);}
</style>
<script>
VARIANTS.C = {
  name: "Disposable Camera Field Report",
  render(el){
    const aff = judgeAffordance();
    const showFinal = STATE.final;
    const tsBurn = new Date(JUMP.createdAt).toLocaleDateString("en-US",{year:"2-digit",month:"2-digit",day:"2-digit"})
      + " " + new Date(JUMP.createdAt).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
    el.innerHTML = `
    <div class="vC"><div class="vC-in">
      <div class="vC-folder">
        <div class="vC-fhead">
          <div class="case">FIELD REPORT<b>JUMP #0${JUMP.number}</b></div>
          <div class="vC-classif">EVIDENCE PACK</div>
        </div>

        <div class="vC-photo">
          <div class="vC-tape"></div>
          <img src="${JUMP.mediaUrl}" alt="${JUMP.caption}" />
          <div class="ts">${tsBurn}</div>
        </div>

        <div class="vC-fields">
          <div><span class="k">FOOD&nbsp;&nbsp;&nbsp;&nbsp;</span> <span class="v">${JUMP.food}</span></div>
          <div><span class="k">SOURCE&nbsp;&nbsp;</span> <span class="v">${JUMP.source}</span></div>
          <div><span class="k">DEST&nbsp;&nbsp;&nbsp;&nbsp;</span> <span class="v">${JUMP.destination}</span></div>
        </div>

        <div class="vC-cap">${JUMP.caption}</div>
        <div class="vC-by">FILED BY @${JUMP.performerName.toUpperCase()} · ${fmtDate(JUMP.createdAt)} · 2 PHOTOS</div>

        <div class="vC-scoreline">
          <span class="l">${showFinal ? "FINAL SCORE" : "RUNNING AVG"}<br>${JUMP.judgmentCount} JUDGMENTS</span>
          <span class="n" id="vC-num">0.0</span>
        </div>

        ${STATE.disputes ? `<div class="vC-dispute">⚑ DISPUTE — ${JUMP.disputes[0].category}: ${JUMP.disputes[0].note}</div>` : ``}

        <div class="vC-judge">
          <div class="h">▸ JUDGE THE EVIDENCE</div>
          ${aff.mode === "open" ? `
            <div class="vC-criteria">
              ${JUMP.criteria.map((c,i)=>`
                <div class="vC-crow"><span>${c.label.toUpperCase()}</span>
                  <span class="vC-boxes">${[1,2,3,4].map(n=>`<span class="vC-box" data-c="${i}" data-n="${n}">·</span>`).join("")}</span>
                </div>`).join("")}
            </div>
            <button class="vC-stampbtn" id="vC-stamp">STAMP: JUDGMENT FILED</button>
            <div class="vC-jsub">Mark each factor, then stamp the report</div>
          ` : aff.mode === "grace" ? `
            <div class="vC-grace"><div class="t" id="vC-grace">${graceCountdownText()}</div><div class="l">${aff.sub}</div></div>
          ` : `
            <button class="vC-stampbtn done">${aff.label.toUpperCase()}</button>
            ${aff.mode === "judged" ? `<div class="vC-stamped"><span>JUDGMENT FILED</span></div>` : `<div class="vC-jsub">${aff.sub}</div>`}
          `}
        </div>
      </div>
    </div></div>`;

    countUp(el.querySelector("#vC-num"), showFinal ? JUMP.finalScore : JUMP.runningAverage);
    if (aff.mode === "grace") tickGrace(el.querySelector("#vC-grace"));
    if (aff.mode === "open"){
      const picks={};
      el.querySelectorAll(".vC-box").forEach(b=>b.onclick=()=>{
        const ci=b.dataset.c,n=+b.dataset.n; picks[ci]=n;
        el.querySelectorAll(`.vC-box[data-c="${ci}"]`).forEach(x=>{
          const on=+x.dataset.n<=n; x.classList.toggle("x",on); x.textContent=on?"✕":"·";
        });
      });
      const st=el.querySelector("#vC-stamp");
      st.onclick=()=>{
        if(Object.keys(picks).length<4){st.textContent="MARK ALL 4 FACTORS";setTimeout(()=>st.textContent="STAMP: JUDGMENT FILED",900);return;}
        st.outerHTML=`<button class="vC-stampbtn done">JUDGMENT FILED</button><div class="vC-stamped"><span>FILED</span></div>`;
      };
    }
  }
};
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     VARIANT D — EXTREME SPORTS, BUT DUMB  (supporting: badges / share cards)
     Structurally: full-bleed cinematic hero, giant overlaid stat, sponsor CTA.

<style>

.vD-hero{position:relative;height:420px;overflow:hidden;}

<!-- ═══════════════ BOOT + SWITCHER + STATE BAR (prototype frame) ═══════════════ -->
<script>
const ORDER = ["A","B","C","D","E"];
const screen = document.getElementById("screen");
function currentVariant(){
  const v = new URLSearchParams(location.search).get("variant");
  return ORDER.includes(v) ? v : "A";
}
// Debug deep-links: ?state=open|grace|judged|self  ?disputes=1  ?final=1  ?scroll=N
function applyUrlState(){
  const q = new URLSearchParams(location.search);
  const st = q.get("state");
  if (["open","grace","judged","self"].includes(st)){
    STATE.viewer = st;
    document.querySelectorAll("#statebar button[data-state]").forEach(x=>x.classList.toggle("on", x.dataset.state===st));
  }
  if (q.has("disputes")){ STATE.disputes = q.get("disputes")!=="0";
    const b=document.querySelector('#statebar button[data-extra="disputes"]'); if(b) b.classList.toggle("on",STATE.disputes); }
  if (q.has("final")){ STATE.final = q.get("final")!=="0";
    const b=document.querySelector('#statebar button[data-extra="final"]'); if(b) b.classList.toggle("on",STATE.final); }
}
function render(){
  const key = currentVariant();
  const v = VARIANTS[key];
  document.getElementById("vkey").textContent = key;
  document.getElementById("vname").textContent = v ? v.name : "(missing)";
  screen.scrollTop = 0;
  if (v) v.render(screen);
  else screen.innerHTML = `<div style="padding:40px;font-family:monospace">Variant ${key} not built yet.</div>`;
  const sc = new URLSearchParams(location.search).get("scroll");
  if (sc) requestAnimationFrame(()=>{ screen.scrollTop = +sc; });
}
function goto(key){
  const u = new URL(location); u.searchParams.set("variant", key);
  history.replaceState(null,"",u); render();
}
function cycle(dir){
  const i = ORDER.indexOf(currentVariant());
  goto(ORDER[(i + dir + ORDER.length) % ORDER.length]);
}
document.getElementById("prev").onclick = ()=>cycle(-1);
document.getElementById("next").onclick = ()=>cycle(1);
document.addEventListener("keydown",e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input"||tag==="textarea"||e.target.isContentEditable) return;
  if (e.key==="ArrowLeft") cycle(-1);
  if (e.key==="ArrowRight") cycle(1);
});

// state bar: viewer states are mutually exclusive; extras toggle independently.
document.querySelectorAll("#statebar button[data-state]").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#statebar button[data-state]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); STATE.viewer = b.dataset.state; render();
  };
});
document.querySelectorAll("#statebar button[data-extra]").forEach(b=>{
  b.onclick = ()=>{ b.classList.toggle("on"); STATE[b.dataset.extra] = b.classList.contains("on"); render(); };
});

applyUrlState();
render();
</script>
