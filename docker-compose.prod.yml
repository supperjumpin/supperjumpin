services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: supperjumpin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - supperjumpin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      SUPPERJUMPIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/supperjumpin?sslmode=disable
    command:
      - -database
      - postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/supperjumpin?sslmode=disable
      - -path
      - /migrations
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      SUPPERJUMPIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/supperjumpin?sslmode=disable
      SUPPERJUMPIN_ADAPTER_TOKEN: ${SUPPERJUMPIN_ADAPTER_TOKEN:?SUPPERJUMPIN_ADAPTER_TOKEN is required}
      SUPPERJUMPIN_LOG_FORMAT: ${SUPPERJUMPIN_LOG_FORMAT:-json}
      SUPPERJUMPIN_LOG_LEVEL: ${SUPPERJUMPIN_LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/http-healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    environment:
      SUPPERJUMPIN_BOT_TOKEN: ${SUPPERJUMPIN_BOT_TOKEN:?SUPPERJUMPIN_BOT_TOKEN is required}
      SUPPERJUMPIN_BOT_APP_ID: ${SUPPERJUMPIN_BOT_APP_ID:?SUPPERJUMPIN_BOT_APP_ID is required}
      SUPPERJUMPIN_BOT_GUILD_ID: ${SUPPERJUMPIN_BOT_GUILD_ID:-}
      SUPPERJUMPIN_ADAPTER_TOKEN: ${SUPPERJUMPIN_ADAPTER_TOKEN:?SUPPERJUMPIN_ADAPTER_TOKEN is required}
      SUPPERJUMPIN_API_BASE_URL: http://api:8080
      SUPPERJUMPIN_BOT_DATA_DIR: /var/lib/supperjumpin-bot
      SUPPERJUMPIN_BOT_EVIDENCE_ADDR: :9999
      SUPPERJUMPIN_BOT_EVIDENCE_BASE_URL: ${SUPPERJUMPIN_BOT_EVIDENCE_BASE_URL:?SUPPERJUMPIN_BOT_EVIDENCE_BASE_URL is required}
    ports:
      - "127.0.0.1:${SUPPERJUMPIN_BOT_EVIDENCE_PORT:-9999}:9999"
    volumes:
      - supperjumpin-bot-data:/var/lib/supperjumpin-bot
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/http-healthcheck", "http://127.0.0.1:9999/livez"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  supperjumpin-postgres-data:
  supperjumpin-bot-data:
