services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: supperjumpin
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - supperjumpin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supperjumpin"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  supperjumpin-postgres:
