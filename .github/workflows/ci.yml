name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run setup
        run: npm run setup

      - name: Verify API client sync
        run: |
          npm run generate:api-client
          git diff --exit-code packages/api-client/src

      - name: Run npm coverage
        run: npm run test:coverage

      - name: Run mobile typecheck
        run: npm --workspace @supperjumpin/mobile run typecheck

      - name: Run API tests (Postgres-backed)
        run: npm run api:test:coverage
        env:
          SUPPERJUMPIN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/supperjumpin_test?sslmode=disable

      - name: Verify sqlc generated code is fresh
        run: npm run generate:sqlc && git diff --exit-code
