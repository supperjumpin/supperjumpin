name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/bot-discord/go.sum
            magefile/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Install local tool binaries
        run: ~/go/bin/mage init:tools

      - name: Run lint
        run: ~/go/bin/mage ci:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/bot-discord/go.sum
            magefile/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Install local tool binaries
        run: ~/go/bin/mage init:tools

      - name: Run tests with coverage
        run: ~/go/bin/mage ci:test

      - name: Upload coverage baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: coverage/
          retention-days: 90

      - name: Compare coverage against main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo ${{ github.repository }} --branch main --workflow ci.yml --json databaseId --jq '.[0].databaseId' --status success --limit 1)
          if [ -z "$RUN_ID" ]; then
            echo "No successful main run found; skipping coverage comparison"
            exit 0
          fi
          mkdir -p coverage/baseline
          if ! gh run download "$RUN_ID" --repo ${{ github.repository }} --name coverage-baseline --dir coverage/baseline/ 2>/dev/null; then
            echo "No baseline artifact found; skipping coverage comparison"
            exit 0
          fi
          ~/go/bin/mage ci:comment coverage coverage/baseline > coverage/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file coverage/comment.md --edit-last 2>/dev/null || \
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file coverage/comment.md

      - name: Stop local Postgres
        if: always()
        run: ~/go/bin/mage db:down

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/bot-discord/go.sum
            magefile/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Run image builds
        run: ~/go/bin/mage ci:build
