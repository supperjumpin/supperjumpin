name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify API client sync
        run: |
          npm run generate:api-client
          git diff --exit-code packages/api-client/src

      - name: Run npm tests
        run: npm test

      - name: Run mobile typecheck
        run: npm --workspace @supperjumpin/mobile run typecheck

      - name: Run Go tests
        run: go test ./apps/api/...

      - name: Verify sqlc generated code is fresh
        run: npm run sqlc:generate && git diff --exit-code
